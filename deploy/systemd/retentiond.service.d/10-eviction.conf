# TeslaUSB B-1: value-based eviction (ARMED, PERMANENT) — applied 2026-07-15.
#
# ============================ NOT AUTO-INSTALLED ============================
# This file is a VERSION-CONTROLLED RECORD of the drop-in running on the live
# device. It is deliberately inert to the build/install path:
#   * release/build-release.sh stages units with
#       find "$units_dir" -maxdepth 1 -type f -name '*.service'
#   * setup-lib/units.sh install_unit_files globs "$src"/*.service
# Neither descends into *.service.d/, so checking this in changes nothing about
# what a build or an install does. It exists so the production configuration is
# reviewable and restorable instead of living only on one SD card.
#
# DO NOT teach the installer to auto-install *.service.d/ without an explicit,
# recorded operator decision: doing so would silently ARM PERMANENT DELETION on
# every fresh install. That is a Tier-3 behavior change, not a packaging tidy-up.
#
# To apply on a device deliberately:
#   sudo install -D -m0644 10-eviction.conf \
#     /etc/systemd/system/retentiond.service.d/10-eviction.conf
#   sudo systemctl daemon-reload && sudo systemctl restart retentiond
# ============================================================================
#
# WHAT IT DOES
# Space-bounded ring buffer. Evicts oldest lowest-value RecentClips first, only
# past the recency floor, and only enough to hold the free-space target.
#   value tiers (indexd reads.rs list_eviction_candidates ORDER BY):
#     tier 0  no_waypoints (no GPS/SEI)      -> evicted first
#     tier 1  parsed_with_waypoints          -> next
#     tier 2  has an associated event row    -> last
#   within a tier: oldest clips.started_at first.
#   thresholds (retentiond config.rs TargetDrainConfig::default):
#     enter below 8% free, stop at 10% free, recency floor 3600s,
#     per-cycle caps 8 GiB / 256 items / 5000 ms.
#   structural exclusions: SavedClips and SentryClips are never candidates
#   (folder_class='RecentClips' + MAX(is_sentry)=0); pinned rows excluded.
#
# ⚠ DURABILITY IS **NOT** REQUIRED FOR DELETION.
# retentiond main.rs wires allow_undurable = enable_eviction, so enabling
# eviction bypasses indexd's PROVEN_DURABLE gate. Clips are deleted whether or
# not they were ever uploaded anywhere. --allow-permanent-loss is what promotes
# DryRun -> Armed (resolve_eviction_mode). Deletion here is irreversible.
#
# Verified on 2026-07-15: 94 tier-0 junk clips deleted, all 48 valuable
# (SEI/GPS + event) clips preserved, index integrity ok, free 5.23% -> 10.01%.
#
# NOTE (2026-08-04): earlier revisions of this comment described a --drain-only
# "Phase 1" that paused the archive copy pass. The ExecStart below does NOT pass
# --drain-only; the archive pass is active. That comment was stale and is removed.
#
# Revert to DryRun: drop --allow-permanent-loss below, daemon-reload, restart.
# Disable entirely: remove this file, daemon-reload, restart (falls back to the
# shipped unit's --no-delete).
[Service]
ExecStart=
ExecStart=/usr/local/bin/retentiond serve --archive-recent-only --enable-eviction --recency-floor-secs 3600 --allow-permanent-loss --archive-root /data/teslausb/archive --volume-image /data/teslausb/teslacam.img
