[package]
name = "teslausb-migrate"
description = "Read-only legacy migration discovery for TeslaUSB B-1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "teslausb_migrate"
path = "src/lib.rs"

[[bin]]
name = "teslausb-migrate"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
